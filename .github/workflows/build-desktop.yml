name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  build:
    name: Build and package (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            artifact: macOS
            archive: IPFSDownloader-macOS.tar.gz
          - os: windows-latest
            target: windows
            artifact: Windows
            archive: IPFSDownloader-Windows.zip
          - os: ubuntu-latest
            target: linux
            artifact: Linux
            archive: IPFSDownloader-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - name: Install dependencies
        run: flutter pub get
      - name: Build release bundle
        run: flutter build ${{ matrix.target }} --release

      - name: Package macOS application
        if: matrix.target == 'macos'
        run: >-
          tar -czf "${{ matrix.archive }}"
          -C build/macos/Build/Products/Release
          ipfs_downloader.app

      - name: Package Windows application
        if: matrix.target == 'windows'
        shell: pwsh
        run: >-
          Compress-Archive
          -Path 'build/windows/x64/runner/Release/*'
          -DestinationPath '${{ matrix.archive }}'

      - name: Package Linux application
        if: matrix.target == 'linux'
        run: >-
          tar -czf "${{ matrix.archive }}"
          -C build/linux/x64/release
          bundle

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: IPFSDownloader-${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0
