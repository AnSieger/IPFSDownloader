name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  build:
    name: Build and package (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
            artifact: macOS
            archive: IPFSDownloader-macOS.tar.gz
          - os: windows-latest
            target: windows
            artifact: Windows
            archive: IPFSDownloader-Windows.zip
          - os: ubuntu-latest
            target: linux
            artifact: Linux
            archive: IPFSDownloader-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - name: Install dependencies
        run: flutter pub get
      - name: Build release bundle
        run: flutter build ${{ matrix.target }} --release

      - name: Bundle Visual C++ runtime
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw "Could not find vswhere at $vswhere"
          }

          $visualStudioPath = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $visualStudioPath) {
            throw 'Could not find a Visual Studio installation with the C++ toolchain'
          }

          $redistRoot = Join-Path $visualStudioPath 'VC\Redist\MSVC'
          $redistVersion = Get-ChildItem $redistRoot -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $redistVersion) {
            throw "Could not find the Visual C++ redistributable files below $redistRoot"
          }

          $crtDirectory = Get-ChildItem (Join-Path $redistVersion.FullName 'x64') `
            -Directory `
            -Filter 'Microsoft.VC*.CRT' |
            Select-Object -First 1
          if (-not $crtDirectory) {
            throw "Could not find the x64 Visual C++ runtime below $($redistVersion.FullName)"
          }

          $releaseDirectory = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $releaseDirectory -PathType Container)) {
            throw "Could not find the Windows release bundle at $releaseDirectory"
          }

          $runtimeDlls = @(
            'msvcp140.dll',
            'vcruntime140.dll',
            'vcruntime140_1.dll'
          )
          foreach ($runtimeDll in $runtimeDlls) {
            $source = Join-Path $crtDirectory.FullName $runtimeDll
            if (-not (Test-Path $source)) {
              throw "Required Visual C++ runtime file is missing: $source"
            }
            Copy-Item $source $releaseDirectory
          }

      - name: Package macOS application
        if: matrix.target == 'macos'
        run: >-
          tar -czf "${{ matrix.archive }}"
          -C build/macos/Build/Products/Release
          ipfs_downloader.app

      - name: Package Windows application
        if: matrix.target == 'windows'
        shell: pwsh
        run: >-
          Compress-Archive
          -Path 'build/windows/x64/runner/Release/*'
          -DestinationPath '${{ matrix.archive }}'

      - name: Package Linux application
        if: matrix.target == 'linux'
        run: >-
          tar -czf "${{ matrix.archive }}"
          -C build/linux/x64/release
          bundle

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: IPFSDownloader-${{ matrix.artifact }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          compression-level: 0
